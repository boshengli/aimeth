name: Runtime and integrity checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run standard-library checks
        run: |
          python3 --version
          python3 -m unittest discover -s tests -v
          python3 tools/verify_artifacts.py examples/replay/manifest.json
          python3 tools/verify_artifacts.py archives/foundation-v1/foundation-manifest.json
          python3 tools/verify_artifacts.py milestones/m1-foundation-v1.manifest.json
          python3 tools/build_milestone.py --output /tmp/m1.html
          cmp milestones/m1-foundation-v1.html /tmp/m1.html
          python3 tools/verify_artifacts.py runtime-report-manifest.json
          python3 tools/build_runtime_milestone.py --output /tmp/m1-1.html
          cmp milestones/m1-1-runtime-v1.html /tmp/m1-1.html
          python3 tools/verify_artifacts.py publication-report-manifest.json
          python3 tools/build_publication_milestone.py --output /tmp/publication.html
          cmp milestones/m1-1-publication-v1.html /tmp/publication.html
          python3 tools/check_organization_evidence.py
          python3 tools/verify_artifacts.py organization-report-manifest.json
          python3 tools/build_organization_milestone.py --output /tmp/m2-1.html
          cmp milestones/m2-1-organization-v1.html /tmp/m2-1.html
          python3 tools/check_cluster_evidence.py
          python3 tools/verify_artifacts.py cluster-report-manifest.json
          python3 tools/build_cluster_milestone.py --output /tmp/cluster.html
          cmp milestones/m2-1-cluster-pilot-v1.html /tmp/cluster.html
          python3 tools/verify_artifacts.py cluster-report-v2-manifest.json
          python3 tools/build_cluster_milestone_v2.py --output /tmp/cluster-v2.html
          cmp milestones/m2-1-cluster-pilot-v2.html /tmp/cluster-v2.html
